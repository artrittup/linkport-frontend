name: linkport-frontend

services:
  frontend:
    image: linkport-frontend-dev:local
    build:
      context: .
      target: development
    init: true
    working_dir: /workspace
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules

  frontend-production:
    profiles: [production]
    image: linkport-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      target: production
    init: true
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://127.0.0.1:8000/api}"
    ports:
      - "${PROD_PORT:-8080}:8080"

volumes:
  dependencies:
